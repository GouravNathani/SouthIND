<!doctype html>
<html lang="en" data-theme="midnight" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <link rel="icon" type="image/png" sizes="32x32" href="/conf/favicon-32.png" />
    <link rel="apple-touch-icon" href="/conf/icon-192.png" />
    <title>SouthIND SuperAdmin</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong skin.
      // Super defaults to Midnight, deliberately unlike the branch panel's Ledger:
      // these two panels look alike and act on the same records, so the chrome has
      // to make it obvious which one you are typing into.
      (function () {
        try {
          var t = localStorage.getItem("sind_super_theme") || "midnight";
          var m = localStorage.getItem("sind_super_mode") || "dark";
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.mode = m;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
